<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨迹数据查看器</title>
<link rel="stylesheet" href="/static/vendor/element-plus.css">
<link rel="stylesheet" href="/static/vendor/element-plus-dark.css">
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/vendor/element-plus.full.min.js"></script>
<script src="/static/vendor/axios.min.js"></script>
<style>
:root{
  --bg-0:#080b14; --bg-1:#0c1120; --bg-2:#111830; --bg-3:#151d3a;
  --border:rgba(0,217,255,.16); --border-hi:rgba(0,217,255,.4);
  --text-0:#e8f1ff; --text-1:#9fb0d4; --text-2:#5b6a8f;
  --neon-cyan:#00d9ff; --neon-green:#00ffa8; --neon-amber:#ffc23c;
  --neon-red:#ff3d6e; --neon-purple:#8b6bff; --neon-gray:#5b6a8f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text-0);min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%, rgba(0,217,255,.08), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(139,107,255,.07), transparent 40%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/28px 100%,
    var(--bg-0);
}
.hdr{
  background:linear-gradient(180deg,rgba(12,17,32,.95),rgba(10,14,26,.92));
  backdrop-filter:blur(6px);
  color:var(--text-0);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border-hi);
  box-shadow:0 1px 24px rgba(0,217,255,.12), 0 4px 20px rgba(0,0,0,.5);
}
.hdr-title{
  font-size:18px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,var(--neon-cyan),var(--neon-purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.hdr-right{display:flex;align-items:center;gap:10px}
.content{max-width:1400px;margin:0 auto;padding:24px}
.panel{
  background:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.panel-title{
  font-size:13px;font-weight:700;color:var(--text-0);margin-bottom:16px;display:flex;align-items:center;gap:8px;
  letter-spacing:.5px;text-transform:uppercase;
}
.panel-title::before{content:'';width:3px;height:14px;background:linear-gradient(var(--neon-cyan),var(--neon-purple));border-radius:2px;display:inline-block}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.funnel-lbl{width:90px;font-size:12px;color:var(--text-1);text-align:right;flex-shrink:0;cursor:help;border-bottom:1px dashed var(--text-2)}
.funnel-bar{flex:1;height:26px;background:var(--bg-0);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.funnel-fill{
  height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-size:11px;
  color:#04141c;font-weight:700;transition:width .8s ease;min-width:2px;
  box-shadow:0 0 12px -2px currentColor;
}
.funnel-n{width:55px;text-align:right;font-weight:700;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-shadow:0 0 14px currentColor}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.tbl-title{font-size:13px;font-weight:700;color:var(--text-0);display:flex;align-items:center;gap:6px;letter-spacing:.5px;text-transform:uppercase}
.tbl-title::before{content:'';width:3px;height:14px;background:linear-gradient(var(--neon-cyan),var(--neon-purple));border-radius:2px;display:inline-block}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pg-wrap{margin-top:14px;display:flex;justify-content:flex-end}
.comp-bar{height:6px;background:var(--bg-0);border:1px solid var(--border);border-radius:3px;overflow:hidden;flex:1}
.comp-fill{height:100%;border-radius:3px;box-shadow:0 0 8px -1px currentColor}
.pulse{display:inline-block;width:8px;height:8px;background:var(--neon-green);border-radius:50%;box-shadow:0 0 8px var(--neon-green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.el-table .row-eq1 td{background:rgba(255,61,110,.10)!important}
.el-table .row-ge05 td{background:rgba(255,194,60,.08)!important}
.progress-indet{height:4px;background:rgba(255,194,60,.15);border-radius:2px;overflow:hidden;position:relative;margin-top:10px}
.progress-indet::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--neon-amber);box-shadow:0 0 10px var(--neon-amber);animation:indet 1.1s infinite linear}
@keyframes indet{0%{left:-40%}100%{left:100%}}
.progress-line{
  margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  color:var(--neon-amber);background:rgba(255,194,60,.06);border:1px solid rgba(255,194,60,.25);
  padding:6px 10px;border-radius:4px;white-space:pre-wrap;word-break:break-all;
}
.log-tail{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--text-1);
  max-height:220px;overflow:auto;background:var(--bg-0);border:1px solid var(--border);
  padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;
}
.traj-section{margin-top:16px}
.traj-loading{display:flex;align-items:center;gap:8px;justify-content:center;padding:16px;color:var(--text-1);font-size:13px}
.traj-spinner{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--neon-cyan);
  display:inline-block;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.traj-viewer{margin-top:10px;max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:6px;background:var(--bg-0)}
.traj-meta{font-size:11px;color:var(--text-2);padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-0)}
.traj-msg{padding:10px 12px;border-bottom:1px solid rgba(0,217,255,.06);display:flex;gap:10px}
.traj-msg:last-child{border-bottom:none}
.traj-msg-role{
  flex-shrink:0;width:64px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding-top:2px;font-family:ui-monospace,monospace;
}
.role-system .traj-msg-role{color:var(--text-2)}
.role-user .traj-msg-role{color:var(--neon-cyan)}
.role-assistant .traj-msg-role{color:var(--neon-purple)}
.role-tool .traj-msg-role{color:var(--neon-green)}
.traj-msg-body{flex:1;min-width:0;font-size:12px;line-height:1.6}
.traj-reasoning{color:var(--text-2);font-style:italic;white-space:pre-wrap;word-break:break-word;margin-bottom:6px}
.traj-content{color:var(--text-0);white-space:pre-wrap;word-break:break-word}
.traj-cut{color:var(--neon-amber);font-size:11px}
.traj-toolcalls{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.traj-toolcall{
  font-family:ui-monospace,monospace;font-size:11px;color:var(--neon-green);
  background:rgba(0,255,168,.06);border:1px solid rgba(0,255,168,.2);border-radius:4px;padding:4px 8px;
  word-break:break-all;
}
.task-name-link{color:var(--neon-cyan);cursor:pointer;font-weight:600}
.task-name-link:hover{text-decoration:underline}
.task-obs{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-2)}
.breadcrumb{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--text-1)}
.breadcrumb-back{color:var(--neon-cyan);cursor:pointer;display:flex;align-items:center;gap:4px}
.breadcrumb-back:hover{text-decoration:underline}
.task-info-panel{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.task-info-name{font-size:16px;font-weight:700;color:var(--text-0)}
.task-info-obs{font-size:11px;color:var(--text-2);font-family:ui-monospace,monospace;word-break:break-all}
</style>
</head>
<body>
<div id="app">

<!-- Header -->
<div class="hdr">
  <div class="hdr-title">轨迹数据查看器</div>
  <div class="hdr-right">
    <el-tag v-if="jobStatus.running" type="success" size="small" style="display:flex;align-items:center;gap:4px">
      <span class="pulse"></span> {{ runningTaskName }} 采集中
    </el-tag>
    <span v-if="jobStatus.running" style="font-size:11px;color:var(--neon-amber);font-family:ui-monospace,monospace">已运行 {{ elapsedSeconds }}s</span>
    <el-button size="small" type="primary" @click="openTaskForm">登记采集任务</el-button>
  </div>
</div>

<div class="content">

  <!-- 全局运行中 / 出错提示 -->
  <el-alert v-if="jobStatus.running" type="warning" show-icon :closable="false" style="margin-bottom:18px">
    <template #title>「{{ runningTaskName }}」采集中（已运行 {{ elapsedSeconds }}s）</template>
    <div class="progress-indet"></div>
    <div class="progress-line" v-if="jobStatus.progress">{{ jobStatus.progress }}</div>
    <el-collapse style="margin-top:8px" v-if="jobStatus.log_tail && jobStatus.log_tail.length">
      <el-collapse-item title="查看详细日志" name="log">
        <pre class="log-tail">{{ jobStatus.log_tail.join('\n') }}</pre>
      </el-collapse-item>
    </el-collapse>
  </el-alert>

  <!-- ============ 总览视图 ============ -->
  <template v-if="view === 'overview'">
    <el-alert v-if="!stats.available && !jobStatus.running" title="尚无数据" type="info" show-icon :closable="false"
      description="点击右上角「登记采集任务」，填写任务名称与两个 OBS 地址后即可开始采集。" style="margin-bottom:18px"></el-alert>

    <div v-if="stats.available" class="panel">
      <div class="panel-title">数据总览</div>
      <div v-for="f in funnelRows" :key="f.label" class="funnel-row">
        <el-tooltip :content="f.tip" placement="top">
          <div class="funnel-lbl">{{ f.label }}</div>
        </el-tooltip>
        <div class="funnel-bar">
          <div class="funnel-fill" :style="{width:f.pct+'%',background:f.color}">
            {{ f.pct > 9 ? f.pct + '%' : '' }}
          </div>
        </div>
        <div class="funnel-n" :style="{color:f.color}">{{ f.count }}</div>
      </div>
    </div>

    <div class="panel">
      <div class="tbl-hdr">
        <div class="tbl-title">采集任务 <el-tag size="small" type="info">共 {{ tasks.length }} 个</el-tag></div>
      </div>
      <el-table :data="tasks" size="small" border v-loading="tasksLoading">
        <el-table-column label="任务名称" min-width="160" show-overflow-tooltip>
          <template #default="{row}">
            <span class="task-name-link" @click="enterTask(row)">{{ row.name }}</span>
          </template>
        </el-table-column>
        <el-table-column label="Assistant OBS" min-width="200" show-overflow-tooltip>
          <template #default="{row}"><span class="task-obs">{{ row.assistant_obs || '—' }}</span></template>
        </el-table-column>
        <el-table-column label="Eval OBS" min-width="200" show-overflow-tooltip>
          <template #default="{row}"><span class="task-obs">{{ row.evaluator_obs || '—' }}</span></template>
        </el-table-column>
        <el-table-column label="L0/L1/L2/L3" width="150" align="center">
          <template #default="{row}">
            <span v-if="row.available" style="font-family:ui-monospace,monospace;font-size:12px">
              {{ row.filtered_count }}/{{ row.with_eval_count }}/{{ row['completion_ge_0.5'] }}/{{ row.completion_eq_1 }}
            </span>
            <span v-else style="color:var(--text-2)">—</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="100" align="center">
          <template #default="{row}">
            <el-tag v-if="jobStatus.running && jobStatus.task_id === row.id" type="warning" size="small">采集中</el-tag>
            <el-tag v-else-if="row.last_exit_code === 0" type="success" size="small">成功</el-tag>
            <el-tag v-else-if="row.last_exit_code !== null && row.last_exit_code !== undefined" type="danger" size="small">失败</el-tag>
            <el-tag v-else type="info" size="small">未运行</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="100" align="center">
          <template #default="{row}">
            <el-button size="small" text :disabled="jobStatus.running" @click="retriggerTask(row)">重新采集</el-button>
          </template>
        </el-table-column>
      </el-table>
    </div>
  </template>

  <!-- ============ 任务详情视图 ============ -->
  <template v-if="view === 'task' && activeTask">
    <div class="breadcrumb">
      <span class="breadcrumb-back" @click="backToOverview">← 返回总览</span>
    </div>
    <div class="task-info-panel">
      <div class="task-info-name">{{ activeTask.name }}</div>
      <div class="task-info-obs">assistant: {{ activeTask.assistant_obs || '—' }}</div>
      <div class="task-info-obs">eval: {{ activeTask.evaluator_obs || '—' }}</div>
    </div>

    <el-alert v-if="!activeTask.available && !(jobStatus.running && jobStatus.task_id === activeTaskId)" title="该任务尚无数据" type="info" show-icon :closable="false"
      description="可能仍在采集中，或采集尚未成功，可点击下方「重新采集」。" style="margin-bottom:18px"></el-alert>

    <div class="panel" v-if="activeTask.available || sessions.length">
      <div class="tbl-hdr">
        <div class="tbl-title">
          会话详情
          <el-tag size="small" type="info">共 {{ sessionsTotal }} 条</el-tag>
        </div>
        <div class="filters">
          <el-select v-model="completionFilter" placeholder="全部" clearable size="small" style="width:140px" @change="onFilterChange">
            <el-option label="全部" value=""></el-option>
            <el-option label="有评测结果" value="has_eval"></el-option>
            <el-option label="无评测结果" value="no_eval"></el-option>
            <el-option label="Completion ≥ 0.5" value="ge05"></el-option>
            <el-option label="Completion = 1" value="eq1"></el-option>
          </el-select>
          <el-select v-model="pageSize" size="small" style="width:90px" @change="onFilterChange">
            <el-option :value="10" label="10 / 页"></el-option>
            <el-option :value="20" label="20 / 页"></el-option>
            <el-option :value="50" label="50 / 页"></el-option>
          </el-select>
          <el-button size="small" :disabled="jobStatus.running" @click="retriggerTask(activeTask)">重新采集</el-button>
        </div>
      </div>
      <el-table :data="sessions" v-loading="loading" stripe border size="small"
        @row-click="openDetail" style="cursor:pointer;width:100%" :row-class-name="rowClass">
        <el-table-column type="index" width="50" label="#" align="center"></el-table-column>
        <el-table-column prop="session" label="Session" min-width="220" show-overflow-tooltip></el-table-column>
        <el-table-column label="评测" width="72" align="center">
          <template #default="{row}">
            <el-tag :type="row.has_eval?'success':'info'" size="small">{{ row.has_eval?'有':'无' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="Completion" width="150">
          <template #default="{row}">
            <template v-if="row.completion!==null && row.completion!==undefined">
              <div style="display:flex;align-items:center;gap:6px;padding:2px 0">
                <div class="comp-bar"><div class="comp-fill" :style="{width:(row.completion*100)+'%',background:completionColor(row.completion)}"></div></div>
                <span style="font-size:12px;min-width:34px;font-weight:600">{{ row.completion.toFixed(2) }}</span>
              </div>
            </template>
            <span v-else style="color:var(--text-2);font-size:12px">—</span>
          </template>
        </el-table-column>
        <el-table-column prop="eval_qc" label="Eval QC Trace" min-width="200" show-overflow-tooltip></el-table-column>
      </el-table>
      <div class="pg-wrap">
        <el-pagination v-model:current-page="currentPage" v-model:page-size="pageSize"
          :total="sessionsTotal" layout="total, prev, pager, next"
          @current-change="loadSessions" background small></el-pagination>
      </div>
    </div>
  </template>

</div><!-- /content -->

<!-- 登记采集任务 Dialog -->
<el-dialog v-model="taskFormVisible" title="登记采集任务" width="560px" destroy-on-close>
  <el-form :model="taskForm" label-position="top" @submit.prevent>
    <el-form-item label="任务名称" required>
      <el-input v-model="taskForm.name" placeholder="例如: 0717-口腔科普任务批次"></el-input>
    </el-form-item>
    <el-form-item label="Assistant 轨迹 OBS 地址" required>
      <el-input v-model="taskForm.assistant_obs" placeholder="obs://rl-agentdata/.../ex-xxxxx/"></el-input>
    </el-form-item>
    <el-form-item label="Eval 轨迹 OBS 地址" required>
      <el-input v-model="taskForm.evaluator_obs" placeholder="obs://rl-agentdata/.../ex-xxxxx/"></el-input>
    </el-form-item>
  </el-form>
  <template #footer>
    <el-button @click="taskFormVisible = false">取消</el-button>
    <el-button type="primary" :loading="taskFormSubmitting" @click="submitTaskForm">登记并开始采集</el-button>
  </template>
</el-dialog>

<!-- Session Detail Dialog -->
<el-dialog v-model="detailVisible" title="会话详情" width="720px" destroy-on-close>
  <template v-if="selectedSession">
    <el-descriptions :column="1" border size="small">
      <el-descriptions-item label="Session ID">
        <span style="font-family:ui-monospace,monospace;font-size:12px;color:var(--neon-cyan);word-break:break-all">{{ selectedSession.session }}</span>
      </el-descriptions-item>
      <el-descriptions-item label="有评测结果">
        <el-tag :type="selectedSession.has_eval?'success':'info'">{{ selectedSession.has_eval?'是':'否' }}</el-tag>
      </el-descriptions-item>
      <el-descriptions-item label="Completion Score">
        <template v-if="selectedSession.completion!==null && selectedSession.completion!==undefined">
          <div style="display:flex;align-items:center;gap:10px">
            <el-progress :percentage="Math.round(selectedSession.completion*100)"
              :color="completionColor(selectedSession.completion)" :stroke-width="12" style="flex:1"></el-progress>
            <strong style="font-size:16px">{{ selectedSession.completion.toFixed(3) }}</strong>
          </div>
        </template>
        <span v-else style="color:var(--text-2)">无</span>
      </el-descriptions-item>
      <el-descriptions-item label="Eval QC Trace ID">
        <span style="font-family:ui-monospace,monospace;font-size:12px;color:var(--text-1)">{{ selectedSession.eval_qc || '—' }}</span>
      </el-descriptions-item>
    </el-descriptions>

    <div class="traj-section">
      <el-button v-if="!trajLoaded && !trajLoading" size="small" @click="loadTrajectory" style="width:100%">
        查看具体轨迹
      </el-button>
      <div v-if="trajLoading" class="traj-loading">
        <span class="traj-spinner"></span> 正在加载轨迹...
      </div>
      <el-alert v-if="trajError" :title="trajError" type="error" show-icon :closable="false" style="margin-top:10px"></el-alert>

      <div v-if="trajLoaded" class="traj-viewer">
        <div class="traj-meta">
          共 {{ trajData.message_count }} 条消息{{ trajData.model ? ' · 模型 ' + trajData.model : '' }}
        </div>
        <div class="traj-msg" v-for="(m, i) in trajData.messages" :key="i" :class="'role-' + m.role">
          <div class="traj-msg-role">{{ roleLabel(m.role) }}</div>
          <div class="traj-msg-body">
            <div v-if="m.reasoning_content" class="traj-reasoning">
              {{ m.reasoning_content }}<span v-if="m.reasoning_truncated" class="traj-cut"> …(已截断)</span>
            </div>
            <div v-if="m.content" class="traj-content">
              {{ m.content }}<span v-if="m.truncated" class="traj-cut"> …(已截断)</span>
            </div>
            <div v-if="m.tool_calls && m.tool_calls.length" class="traj-toolcalls">
              <div v-for="(tc, j) in m.tool_calls" :key="j" class="traj-toolcall">
                🔧 {{ tc.name }}<span v-if="tc.arguments">({{ tc.arguments }})</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</el-dialog>

</div><!-- /app -->

<script>
const { createApp } = Vue

createApp({
  data() {
    return {
      view: 'overview',
      tasks: [],
      tasksLoading: false,
      activeTaskId: null,

      taskFormVisible: false,
      taskFormSubmitting: false,
      taskForm: { name: '', assistant_obs: '', evaluator_obs: '' },

      stats: { available: false },
      sessions: [],
      sessionsTotal: 0,
      currentPage: 1,
      pageSize: 20,
      completionFilter: '',
      loading: false,
      jobStatus: {},
      selectedSession: null,
      detailVisible: false,
      trajLoading: false,
      trajLoaded: false,
      trajError: '',
      trajData: null,
      _pollTimer: null,
      _tickTimer: null,
      nowTick: Date.now(),
    }
  },

  computed: {
    activeTask() {
      return this.tasks.find(t => t.id === this.activeTaskId) || null
    },
    runningTaskName() {
      if (!this.jobStatus.running) return ''
      const t = this.tasks.find(t => t.id === this.jobStatus.task_id)
      return t ? t.name : (this.jobStatus.task_id || '任务')
    },
    elapsedSeconds() {
      if (!this.jobStatus.running || !this.jobStatus.started_at) return 0
      const started = new Date(this.jobStatus.started_at).getTime()
      return Math.max(0, Math.round((this.nowTick - started) / 1000))
    },
    funnelRows() {
      const total = (this.stats.filtered_count || 0) + (this.stats.dropped_count || 0)
      const p = (n) => total ? Math.round((n || 0) / total * 100) : 0
      return [
        { label: '总轨迹数', count: total, pct: 100, color: '#5b6a8f',
          tip: `所有已登记任务下载到本地的原始轨迹总数(筛选后 ${this.stats.filtered_count || 0} + 丢弃 ${this.stats.dropped_count || 0})` },
        { label: 'L0', count: this.stats.filtered_count || 0, pct: p(this.stats.filtered_count), color: '#00d9ff',
          tip: '筛选后轨迹数: 错误备注为空或仅含"200空响应"的会话，即通过基础质量筛查的轨迹' },
        { label: 'L1', count: this.stats.with_eval_count || 0, pct: p(this.stats.with_eval_count), color: '#00ffa8',
          tip: '有 evaluator 首轮评测结果的轨迹数(含 completion=null 的裁决)' },
        { label: 'L2', count: this.stats['completion_ge_0.5'] || 0, pct: p(this.stats['completion_ge_0.5']), color: '#ffc23c',
          tip: 'evaluator 给出的 completion 分数 ≥ 0.5 的轨迹数(仅统计 completion 为数值的情况)' },
        { label: 'L3', count: this.stats.completion_eq_1 || 0, pct: p(this.stats.completion_eq_1), color: '#ff3d6e',
          tip: 'evaluator 给出的 completion 分数 = 1 的轨迹数，即完全达成任务的最高质量轨迹' },
      ]
    },
  },

  methods: {
    async loadStats() {
      try { const r = await axios.get('/api/stats'); this.stats = r.data }
      catch (e) { console.error('loadStats', e) }
    },
    async loadTasks() {
      this.tasksLoading = true
      try {
        const r = await axios.get('/api/tasks')
        this.tasks = r.data.tasks
      } catch (e) { console.error('loadTasks', e) }
      finally { this.tasksLoading = false }
    },
    async loadJobStatus() {
      try { const r = await axios.get('/api/job-status'); this.jobStatus = r.data }
      catch (e) { console.error('loadJobStatus', e) }
    },
    async loadSessions() {
      if (!this.activeTaskId) return
      this.loading = true
      try {
        const p = { page: this.currentPage, page_size: this.pageSize }
        if (this.completionFilter === 'has_eval')  p.has_eval = true
        else if (['no_eval','ge05','eq1'].includes(this.completionFilter)) p.completion_filter = this.completionFilter
        const r = await axios.get(`/api/tasks/${this.activeTaskId}/sessions`, { params: p })
        this.sessions = r.data.sessions
        this.sessionsTotal = r.data.total
      } catch (e) { console.error('loadSessions', e) }
      finally { this.loading = false }
    },

    openTaskForm() {
      this.taskForm = { name: '', assistant_obs: '', evaluator_obs: '' }
      this.taskFormVisible = true
    },
    async submitTaskForm() {
      const { name, assistant_obs, evaluator_obs } = this.taskForm
      if (!name.trim() || !assistant_obs.trim() || !evaluator_obs.trim()) {
        ElementPlus.ElMessage.warning('任务名称、Assistant/Eval OBS 地址均不能为空')
        return
      }
      this.taskFormSubmitting = true
      try {
        const r = await axios.post('/api/tasks', this.taskForm)
        if (r.data.success) {
          ElementPlus.ElMessage.success(r.data.message)
          this.taskFormVisible = false
          await this.loadTasks()
          if (r.data.started) {
            this.jobStatus = { ...this.jobStatus, running: true, task_id: r.data.task.id, started_at: new Date().toISOString() }
            this.startTicking()
            this.startPollUntilDone()
          }
        } else {
          ElementPlus.ElMessage.error(r.data.message || '登记失败')
        }
      } catch (e) {
        ElementPlus.ElMessage.error(e.response?.data?.message || '登记失败，请检查后端服务')
      } finally {
        this.taskFormSubmitting = false
      }
    },

    async retriggerTask(task) {
      try {
        const r = await axios.post(`/api/tasks/${task.id}/trigger`)
        if (r.data.success) {
          ElementPlus.ElMessage.success(r.data.message)
          this.jobStatus = { ...this.jobStatus, running: true, task_id: task.id, started_at: new Date().toISOString() }
          this.startTicking()
          this.startPollUntilDone()
        } else {
          ElementPlus.ElMessage.warning(r.data.message)
        }
      } catch (e) {
        ElementPlus.ElMessage.error('触发失败，请检查后端服务')
      }
    },

    enterTask(task) {
      this.activeTaskId = task.id
      this.view = 'task'
      this.currentPage = 1
      this.completionFilter = ''
      this.sessions = []
      this.sessionsTotal = 0
      this.loadSessions()
    },
    backToOverview() {
      this.view = 'overview'
      this.activeTaskId = null
      this.loadTasks()
    },

    startTicking() {
      if (this._tickTimer) return
      this._tickTimer = setInterval(() => { this.nowTick = Date.now() }, 1000)
    },
    stopTicking() {
      if (this._tickTimer) { clearInterval(this._tickTimer); this._tickTimer = null }
    },
    startPollUntilDone() {
      if (this._pollTimer) return
      this._pollTimer = setInterval(async () => {
        await this.loadJobStatus()
        if (!this.jobStatus.running) {
          clearInterval(this._pollTimer); this._pollTimer = null
          this.stopTicking()
          await this.loadStats(); await this.loadTasks()
          if (this.view === 'task' && this.activeTaskId === this.jobStatus.task_id) await this.loadSessions()
          if (this.jobStatus.last_exit_code === 0) {
            ElementPlus.ElMessage.success(`采集完成，用时 ${this.jobStatus.last_duration_seconds}s`)
          } else {
            ElementPlus.ElMessage.error('采集失败，详情见页面上方错误提示')
          }
        }
      }, 1500)
    },

    onFilterChange() { this.currentPage = 1; this.loadSessions() },
    openDetail(row) {
      this.selectedSession = row
      this.detailVisible = true
      this.trajLoading = false
      this.trajLoaded = false
      this.trajError = ''
      this.trajData = null
    },
    async loadTrajectory() {
      if (!this.selectedSession || !this.activeTaskId) return
      this.trajLoading = true
      this.trajError = ''
      try {
        const r = await axios.get(`/api/tasks/${this.activeTaskId}/session-detail/${encodeURIComponent(this.selectedSession.session)}`)
        if (r.data.found) {
          this.trajData = r.data
          this.trajLoaded = true
        } else {
          this.trajError = r.data.message || '未找到轨迹数据'
        }
      } catch (e) {
        this.trajError = e.response?.data?.message || '加载轨迹失败，请检查后端服务'
      } finally {
        this.trajLoading = false
      }
    },
    roleLabel(role) {
      return { system: 'SYSTEM', user: 'USER', assistant: 'ASSISTANT', tool: 'TOOL' }[role] || (role || '').toUpperCase()
    },
    completionColor(v) {
      if (v === null || v === undefined) return '#5b6a8f'
      if (v >= 1) return '#ff3d6e'
      if (v >= 0.5) return '#ffc23c'
      return '#8b6bff'
    },
    rowClass({ row }) {
      if (row.completion === 1) return 'row-eq1'
      if (typeof row.completion === 'number' && row.completion >= 0.5) return 'row-ge05'
      return ''
    },
  },

  async mounted() {
    await Promise.all([this.loadTasks(), this.loadStats(), this.loadJobStatus()])
    if (this.jobStatus.running) { this.startTicking(); this.startPollUntilDone() }
  },

  beforeUnmount() {
    if (this._pollTimer) clearInterval(this._pollTimer)
    if (this._tickTimer) clearInterval(this._tickTimer)
  },
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
